# /etc/systemd/system/ollama.service.d/keepalive.conf
#
# Drop-in override for the Ollama systemd service.
# Sets OLLAMA_KEEP_ALIVE=-1 so loaded models are NEVER unloaded automatically.
# The jarvis-preload.service will load gemma4:e4b once Ollama is ready.

[Service]
Environment="OLLAMA_KEEP_ALIVE=-1"
