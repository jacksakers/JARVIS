llm:
  provider: ollama
  ollama_url: http://localhost:11434
  # Gemma 4 — strong tool-calling performance, supports parallel tool calls
  model: gemma4:e4b
  options:
    num_ctx: 32768
    temperature: 0.7

database:
  # Path relative to the 3dot0/ directory
  path: jarvis.db

server:
  host: "0.0.0.0"   # Bind to all interfaces (Tailscale + local)
  port: 8000
  reload: false      # Set true for development hot-reload
  # IANA timezone name for the scheduler (cron triggers fire in this zone)
  timezone: "America/New_York"

worker:
  poll_interval_seconds: 2      # How often the worker checks the job queue
  max_tool_iterations: 6        # Safety cap on recursive tool calls per turn

memory:
  max_recent_turns: 8
  max_tokens: 8000

# Default primary user created on first boot (change to your name)
default_user:
  name: "User"
  is_primary: true
